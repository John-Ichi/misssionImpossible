<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Manager</title>
</head>
<body>
    <button onclick="logTasks()">Log Processes</button> <!-- Pang debug lang -->
    <div class="container">
        <h1>Schedule Manager</h1>
        <button type="button" onclick="addTask()">Add Task</button>
        <div id="addTaskDiv"></div>
        <div id="tasksDiv"></div>
        <div id="scheduleDiv"></div>
    </div>
</body>

<script>
    let tasks = [];
    let idAcc = 0;

    function logTasks() { // Pang debug lang pwede remove
        console.log(tasks);
    }

    const addTaskDiv = document.getElementById("addTaskDiv");
    const tasksDiv = document.getElementById("tasksDiv");
    const scheduleDiv = document.getElementById("scheduleDiv");

    function addTask() { // Show form
        addTaskDiv.innerHTML = `
            <label for="taskName">Task Name</label>
            <input type="text" id="taskName" placeholder="Task Name">
            <label for="startTime">Start Time</label>
            <input type="time" id="startTime">
            <label for="durationHours">Duration (hours)</label>
            <input type="number" min="1" id="durationHours">
            <label for="durationMinutes">Duration (minutes)</label>
            <input type="number" min="0" max="59" id="durationMinutes">
            <label for="priorityValue">Set Priority</label>
            <input type="number" min="1" max="5" id="priorityValue">
            <button type="button" onclick="confirmTask()">Confirm</button>
        `;
    }

    function confirmTask() {
        const taskNameInp = document.getElementById("taskName");
        const startTimeInp = document.getElementById("startTime");
        const durationHours = document.getElementById("durationHours");
        const durationMinutes = document.getElementById("durationMinutes");
        const priorityValueInp = document.getElementById("priorityValue");

        if (taskNameInp.value &&
            startTimeInp.value &&
            durationHours.value &&
            durationMinutes.value &&
            priorityValueInp.value
        ) { // Missing values check
            // Para maging 2 digit lang pag less than 10 (e.g. if 7, magiging 07)
            const hours = (durationHours.value < 10) ? `0${durationHours.value}` : durationHours.value;
            const minutes = (durationMinutes.value < 10) ? `0${durationMinutes.value}` : durationMinutes.value;

            idAcc++;
            tasks.push({ // Push information to tasks[]
                id: idAcc,
                taskName: taskNameInp.value,
                startTime: startTimeInp.value, // Arrival Time
                duration: `${hours}:${minutes}`, // Burst Time
                priority: priorityValueInp.value // Priority Value
            });

            addTaskDiv.innerHTML = ""; // Clear form
            renderTasks();
        }
        else { // Walang input
            alert("missing inputs"); // Subject to change
            return false;
        }
    }

    renderTasks();

    // Add option to edit tasks
    function renderTasks() {
        tasksDiv.innerHTML = "<h2>Tasks</h2>"; // Set header
        const algorithmSelect = document.createElement("div"); // div for selecting an algorithm
        algorithmSelect.innerHTML = `
            <select id="algorithm">
                <option value="" selected disabled hidden>Select Algorithm</option>
                <option value="FCFS">First Come First Serve</option>
                <option value="SJF">Shortest Job First</option>
                <option value="Priority">Priority Scheduling</option>
                <option value="SRTF">Shortest Remaining Time First</option>
            </select>
            <button type="button" onclick="optimizeSchedule()">Optimize Schedule</button>
        `;

        if (tasks.length !== 0) {
            tasks.forEach(task => {
                const taskDiv = document.createElement("div"); // Create div per task
                taskDiv.innerHTML = `
                    <p>
                        ID: ${task.id}<br>
                        Name: ${task.taskName}<br>
                        Start Time: ${task.startTime}<br>
                        Duration: ${task.duration}<br>
                        Priority: ${task.priority}
                    </p>
                `;

                tasksDiv.appendChild(taskDiv);
            });

            tasksDiv.appendChild(algorithmSelect);
        } else {
            tasksDiv.innerHTML += `<p><i>No tasks yet.</i></p>`;
        }
    }

    function optimizeSchedule() {
        const selectAlgorithmInp = document.getElementById("algorithm");
        const algorithm = selectAlgorithmInp.value;

        if (algorithm && tasks.length !== 0) {
            switch (algorithm) {
                case "FCFS":
                    optimizeFCFS();
                    break;
                case "SJF":
                    optimizeSJF();
                    break;
                case "Priority":
                    optimizePriority();
                    break;
                case "SRTF":
                    optimizeSRTF();
                    break;
                // Not sure if may default pa ito
            }
        }
    }

    function timeToMinutes(timeStr) { // Helper, translates time to a numerical value (minutes)
        const [hours, minutes] = timeStr.split(":").map(Number); // Pa explain niyo na lang kay AI haha
        return (hours * 60) + minutes;
    }

    function durationToMinutes(durationStr) {
        const [hours, minutes] = durationStr.split(":").map(Number);
        return (hours * 60) + minutes;
    }

    function minutesToTime(totalMinutes) { // Convers total minutes to a timestamp
        const hours = Math.floor(totalMinutes / 60) % 24;
        const minutes = totalMinutes % 60;
        return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
    }

    function optimizeFCFS() {
        scheduleDiv.innerHTML = "<h2>FCFS Schedule</h2>";

        let processes = [...tasks]; // Create separate array from tasks
        let schedule = [];
        let currentTime = 0 // Accumulator for TET
        let totalBurst = 0;
        let idleTime = 0;

        processes.sort((a, b) => { // Sort by Arrival Time
            const timeA = timeToMinutes(a.startTime);
            const timeB = timeToMinutes(b.startTime);

            if (timeA === timeB) return a.id - b.id; // If equal time, sort by ID
            else return timeA - timeB;
        });

        processes.forEach(task => {
            const arrival = timeToMinutes(task.startTime);
            const burst = durationToMinutes(task.duration);
            totalBurst += burst;

            if (currentTime < arrival) {
                schedule.push({
                    label: "Idle",
                    start: currentTime,
                    end: arrival
                });
                idleTime += arrival - currentTime;
                currentTime = arrival;
            }

            task.actualStart = currentTime;
            task.finishTime = currentTime + burst;
            task.turnaroundTime = task.finishTime - arrival;
            task.waitingTime = task.turnaroundTime - burst;

            schedule.push({
                label: task.taskName,
                start: task.actualStart,
                end: task.finishTime
            });

            currentTime = task.finishTime;
        });

        const cpuUtilization = ((totalBurst / (currentTime - idleTime)) * 100).toFixed(2);

        renderSchedule(schedule);
        renderDetails(processes);
        renderMetrics(processes, cpuUtilization);
    }

    function optimizeSJF() {
        scheduleDiv.innerHTML = "<h2>SJF Schedule</h2>";

        let processes = [...tasks]; // Create separate array from tasks
        let schedule = [];
        let currentTime = 0 // Accumulator for TET
        let totalBurst = 0;
        let idleTime = 0;

        processes.forEach(p => p.burst = durationToMinutes(p.duration));

        let completed = [];

        while (completed.length < processes.length) {
            const available = processes.filter(p => !completed.includes(p) && timeToMinutes(p.startTime) <= currentTime);

            if (available.length === 0) {
                const nextArrival = Math.min(...processes.filter(p => !completed.includes(p)).map(p => timeToMinutes(p.startTime)));
                schedule.push({
                    label: "Idle",
                    start: currentTime,
                    end: nextArrival
                });
                idleTime += nextArrival - currentTime;
                currentTime = nextArrival;
                continue;
            }

            available.sort((a, b) => {
                const timeA = timeToMinutes(a.startTime);
                const timeB = timeToMinutes(b.startTime);

                if (a.burst !== b.burst) return a.burst - b.burst;
                if (timeA !== timeB) return timeA - timeB;
                return a.id - b.id;
            });

            const task = available[0];

            const arrival = timeToMinutes(task.startTime);
            task.actualStart = currentTime;
            task.finishTime = currentTime + task.burst;
            task.turnaroundTime = task.finishTime - arrival;
            task.waitingTime = task.turnaroundTime - task.burst;

            schedule.push({
                label: task.taskName,
                start: task.actualStart,
                end: task.finishTime
            });

            totalBurst += task.burst;
            currentTime = task.finishTime;
            completed.push(task);
        }

        const cpuUtilization = ((totalBurst / (currentTime - idleTime)) * 100).toFixed(2);

        renderSchedule(schedule);
        renderDetails(processes);
        renderMetrics(processes, cpuUtilization);
    }

    function optimizePriority() {
        scheduleDiv.innerHTML = "<h2>Priority Schedule</h2>";

        let processes = [...tasks]; // Create separate array from tasks
        let schedule = [];
        let currentTime = 0 // Accumulator for TET
        let totalBurst = 0;
        let idleTime = 0;

        processes.forEach(p => p.burst = durationToMinutes(p.duration));

        let completed = [];

        while (completed.length < processes.length) {
            const available = processes.filter(p => !completed.includes(p) && timeToMinutes(p.startTime) <= currentTime);
            
            if (available.length === 0) {
                const nextArrival = Math.min(...processes.filter(p => !completed.includes(p)).map(p => timeToMinutes(p.startTime)));
                schedule.push({
                    label: "Idle",
                    start: currentTime,
                    end: nextArrival
                });
                idleTime += nextArrival - currentTime;
                currentTime = nextArrival;
                continue;
            }

            available.sort((a, b) => {
                const timeA = timeToMinutes(a.startTime);
                const timeB = timeToMinutes(b.startTime);

                if (a.priority !== b.priority) return a.priority - b.priority;
                if (a.burst !== b.burst) return a.burst - b.burst;
                if (timeA !== timeB) return timeA - timeB;
                return a.id - b.id;
            });

            const task = available[0];

            const arrival = timeToMinutes(task.startTime);
            task.actualStart = currentTime;
            task.finishTime = currentTime + task.burst;
            task.turnaroundTime = task.finishTime - arrival;
            task.waitingTime = task.turnaroundTime - task.burst;

            schedule.push({
                label: task.taskName,
                start: task.actualStart,
                end: task.finishTime
            });

            totalBurst += task.burst;
            currentTime = task.finishTime;
            completed.push(task);
        }

        const cpuUtilization = ((totalBurst / (currentTime - idleTime)) * 100).toFixed(2);

        renderSchedule(schedule);
        renderDetails(processes);
        renderMetrics(processes, cpuUtilization);
    }

    function optimizeSRTF() {
        scheduleDiv.innerHTML = "<h2>SRTF Schedule</h2>";

        let processes = [...tasks]; // Create separate array from tasks
        let schedule = [];
        let currentTime = 0 // Accumulator for TET
        let totalBurst = 0;
        let idleTime = 0;

        processes.forEach(p => p.remaining = durationToMinutes(p.duration));

        let completed = [];
        let lastTask = null;

        while (completed.length < processes.length) {
            const available = processes.filter(p => !completed.includes(p) && timeToMinutes(p.startTime) <= currentTime);

            if (available.length === 0) {
                const nextArrival = Math.min(...processes.filter(p => !completed.includes(p)).map(p => timeToMinutes(p.startTime)));
                if (lastTask && schedule.length && schedule[schedule.length-1].label === "Idle") {
                    schedule[schedule.length-1].end = nextArrival;
                } else {
                    schedule.push({
                        label: "Idle",
                        start: currentTime,
                        end: nextArrival
                    });
                }
                idleTime += nextArrival - currentTime;
                currentTime = nextArrival;
                lastTask = null;
                continue;
            }

            available.sort((a, b) => {
                const timeA = timeToMinutes(a.startTime);
                const timeB = timeToMinutes(b.startTime);

                if (a.remaining !== b.remaining) return a.remaining - b.remaining;
                if (timeA !== timeB) return timeA - timeB;
                return a.id - b.id;
            });

            const task = available[0];

            if (!task.actualStart) task.actualStart = currentTime;
            const nextArrivalTimes = processes
                .filter(p => !completed.includes(p) && p !== task && timeToMinutes(p.startTime) > currentTime)
                .map(p => timeToMinutes(p.startTime));
            const nextArrival = nextArrivalTimes.length ? Math.min(...nextArrivalTimes) : Infinity;

            const timeSlice = Math.min(task.remaining, nextArrival - currentTime);

            if (lastTask === task && schedule.length) {
                schedule[schedule.length-1].end += timeSlice;
            } else {
                schedule.push({
                    label: task.taskName,
                    start: currentTime,
                    end: currentTime + timeSlice
                });
            }

            task.remaining -= timeSlice;
            currentTime += timeSlice;
            lastTask = task;

            if (task.remaining === 0) {
                const arrival = timeToMinutes(task.startTime);
                task.finishTime = currentTime;
                task.turnaroundTime = task.finishTime - arrival;
                task.waitingTime = task.turnaroundTime - durationToMinutes(task.duration);
                totalBurst += durationToMinutes(task.duration);
                completed.push(task);
                lastTask = null;
            }
        }

        const cpuUtilization = ((totalBurst / (currentTime - idleTime)) * 100).toFixed(2);

        renderSchedule(schedule);
        renderDetails(processes);
        renderMetrics(processes, cpuUtilization);
    }

    function renderSchedule(schedule) {
        schedule.forEach(block => {
            const div = document.createElement("div");
            div.innerHTML = `
                <strong>${block.label}</strong><br>
                ${minutesToTime(block.start)} -> ${minutesToTime(block.end)}
                (${block.end - block.start} minutes)
            `;
            scheduleDiv.appendChild(div);
        });
    }

    function renderDetails(processes) {
        scheduleDiv.innerHTML += `
            <h3>Process Details</h3>
            <table border="1" cellpadding="5">
                <tr>
                    <th>Task</th>
                    <th>Arrival</th>
                    <th>Burst</th>
                    <th>Start</th>
                    <th>Finish</th>
                    <th>TAT</th>
                    <th>WT</th>
                </tr>
                ${processes.map(p => `
                    <tr>
                        <td>${p.taskName}</td>
                        <td>${p.startTime}</td>
                        <td>${p.duration}</td>
                        <td>${minutesToTime(p.actualStart)}</td>
                        <td>${minutesToTime(p.finishTime)}</td>
                        <td>${minutesToTime(p.turnaroundTime)}</td>
                        <td>${minutesToTime(p.waitingTime)}</td>
                    </tr>
                `).join("")}
            </table>
        `;
    }

    function renderMetrics(processes, cpuUtilization) {
        const avgTAT = (processes.reduce((s, p) => s + p.turnaroundTime, 0) / processes.length);
        const avgWT = (processes.reduce((s, p) => s + p.waitingTime, 0) / processes.length);

        scheduleDiv.innerHTML += `
            <h3>Metrics</h3>
            <p>Average Turnaround Time: ${avgTAT} minutes</p>
            <p>Average Waiting Time: ${avgWT} minutes</p>
            <p>Task Engagement: ${cpuUtilization}%</p>
        `;
    }

</script>

</html>
